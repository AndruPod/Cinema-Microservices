services:
  cinema_db:
    image: postgres:15-alpine
    container_name: cinema_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: catalog_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${CATALOG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cinema-network

  api-gateway:
    build: .
    container_name: api_gateway
    command: npx nest start --watch api-gateway
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - catalog-service
    networks:
      - cinema-network


  auth-service:
    build: .
    container_name: auth_microservice
    command: npx nest start --watch auth-service
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3003:3003"
    depends_on:
      cinema_db:
        condition: service_healthy
    networks:
      - cinema-network

  catalog-service:
    build: .
    container_name: catalog_microservice
    command: npx nest start --watch catalog-service
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      cinema_db:
        condition: service_healthy
    networks:
      - cinema-network


  order-service:
    build: .
    container_name: order_microservice
    command: npx nest start --watch order-service
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3002:3002"
    depends_on:
      cinema_db:
        condition: service_healthy
    networks:
      - cinema-network

networks:
  cinema-network:
    driver: bridge

volumes:
  pgdata: